name: ci

on:
  push:
    branches:
      - "master"
  schedule:
    - cron: '0 * * * *'

env:
  HATH_VERSION: 1.6.6

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Latest Docker Image Digest
        id: docker_check
        run: |
          # Replace 'library/ubuntu' and 'latest' with your target repo and tag
          REPO="eclipse-temurin:8-jre"
          TAG="latest"
          
          # Get token from Docker Hub Registry
          TOKEN=$(curl -s "https://docker.io" | jq -r '.token')
          
          # Get image digest
          DIGEST=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://docker.io" | jq -r '.config.digest')
          
          echo "Latest digest: $DIGEST"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
      - name: Compare with Cache
        id: cache_compare
        uses: actions/cache@v4
        with:
          path: .docker_digest_cache
          key: docker-digest-${{ steps.docker_check.outputs.digest }}
      - name: Determine if Update is Needed
        id: check_update
        run: |
          if [ "${{ steps.cache_compare.outputs.cache-hit }}" == "true" ]; then
            echo "No new version found."
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected!"
            echo "updated=true" >> $GITHUB_OUTPUT
            # Create the file so it gets cached on successful workflow completion
            echo "${{ steps.docker_check.outputs.digest }}" > .docker_digest_cache
          fi
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ly2314/hath
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.HATH_VERSION }}_{{date 'YYYYMMDD'}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: HATH_VERSION=${{ env.HATH_VERSION }}
